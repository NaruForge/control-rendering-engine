<text x="48" y="739" font-size="12" font-weight="400" fill="#627184" >Generic, illustrative example. Not an OEM-approved architecture or a statement of compliance.</text>
<text x="48" y="764" font-size="12" font-weight="400" fill="#627184" >Control responsibility does not mean every listed quantity is an independent simultaneous setpoint. Unspecified loop roles remain unspecified.</text>
<text x="48" y="789" font-size="12" font-weight="400" fill="#627184" >Hardware bidirectionality is distinct from the power-flow direction enabled in each operating mode.</text>
