<text x="48" y="1019" font-size="12" font-weight="400" fill="#a7b7cd" >Generic, illustrative example. Not an OEM-approved architecture or a statement of compliance.</text>
<text x="48" y="1044" font-size="12" font-weight="400" fill="#a7b7cd" >Control responsibility does not mean every listed quantity is an independent simultaneous setpoint. Unspecified loop roles remain unspecified.</text>
<text x="48" y="1069" font-size="12" font-weight="400" fill="#a7b7cd" >Hardware bidirectionality is distinct from the power-flow direction enabled in each operating mode.</text>
