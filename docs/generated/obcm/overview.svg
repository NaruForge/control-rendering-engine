<title id="diagram-title">OBCM Control Architecture</title>
<desc id="diagram-description">One power stage. Five operating modes. Explicit control responsibility. Generic, illustrative example. Not an OEM-approved architecture or a statement of compliance. Control responsibility does not mean every listed quantity is an independent simultaneous setpoint. Unspecified loop roles remain unspecified. Hardware bidirectionality is distinct from the power-flow direction enabled in each operating mode.</desc>
