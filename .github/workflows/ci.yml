name: Verify Control Studio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '24' }
          - { os: windows-latest, node: '24' }
          - { os: ubuntu-latest, node: '22.16.0' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run generate
      - name: Generated language and example artifacts must match source
        run: git diff --exit-code -- src/language/generated syntax schema docs/generated
  browser:
    name: Production Chromium / authoring and exports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit evidence
        continue-on-error: true
        run: |
          mkdir -p test-results
          npm audit --json > test-results/dependency-audit.json
      - run: npx playwright install --with-deps chromium
      - run: npm run build && node scripts/browser-probe.mjs
      - run: npm run test:browser
      - run: npm run render -- --input examples/cascade.control --view current_loop --out artifacts
      - run: npm run export -- artifacts/current_loop.svg artifacts/current_loop.png
      - run: npm run export -- artifacts/current_loop.svg artifacts/current_loop.pdf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: control-studio-verification
          retention-days: 14
          path: |
            test-results
            artifacts
            dist
