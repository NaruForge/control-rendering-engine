name: Bootstrap verified baseline
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'tests/**', 'examples/**', 'package.json', 'tsconfig.json', 'vite.config.ts', 'index.html', '.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bootstrap
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve and lock dependencies once
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run generate
      - run: npm run render -- --input examples/signal-loop.yaml --view signals --out docs/generated/signal-loop
      - run: npm run render -- --theme midnight --view overview --out docs/generated/midnight
      - run: npm run render -- --theme paper --view overview --out docs/generated/paper
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run export -- docs/generated/overview.svg docs/generated/overview.png
      - run: npm run export -- docs/generated/overview.svg docs/generated/overview.pdf
      - name: Commit only the lockfile and generated public example artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp test-results/workbench.png docs/generated/workbench.png
          git add package-lock.json schema/model.schema.json docs/generated
          if ! git diff --cached --quiet; then
            git commit -m "build: lock dependencies and add verified example renders"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-verification
          path: |
            test-results
            docs/generated
            dist
            package-lock.json
