name: Finalize reviewed studio dependencies
on:
  push:
    branches: [refactor/control-studio]
    paths: [.github/workflows/studio-finalize-dependencies.yml]
permissions:
  contents: read
jobs:
  patch:
    if: github.repository == 'NaruForge/control-rendering-engine' && github.ref == 'refs/heads/refactor/control-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Apply the reviewed patch without unrelated upgrades
        shell: python
        run: |
          import pathlib, json, hashlib
          p = pathlib.Path('src/workbench/App.tsx')
          data = p.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '4b726ea787e46615f14eef5084ad6a71e2ec0cbbcc4b2f5a19a31e9a325c97fd'
          before = "{busy ? 'Compiling model' : valid ? 'Model valid · Preview up to date' : 'Not rendered'}"
          after = "{busy ? 'Compiling model' : canExport ? 'Model valid · Preview up to date' : compilation?.ok ? 'Model valid · View unavailable' : 'Not rendered'}"
          source = data.decode('utf-8')
          assert source.count(before) == 1
          result = source.replace(before, after).encode('utf-8')
          assert hashlib.sha256(result).hexdigest() == '1be7d0db42b2709077e05d4a1b0b6d0534ab991a5c0080e04b2cf2f2e21cd89d'
          p.write_bytes(result)
          p = pathlib.Path('package.json')
          package = json.loads(p.read_text())
          assert not package.get('overrides')
          package['overrides'] = {'@xmldom/xmldom': '0.9.12'}
          p.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run generate
      - run: git diff --exit-code -- src/language/generated syntax schema docs/generated
      - name: Commit only the reviewed application and dependency changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workbench/App.tsx package.json package-lock.json
          git commit -m 'fix: isolate view readiness and patch transitive xmldom security advisories'
          git push origin HEAD:refactor/control-studio
